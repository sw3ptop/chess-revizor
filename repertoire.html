<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#262421">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Мои дебюты</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: phone app — tabs (black / white / cheat sheet); line cards scroll sideways above the coach and board */
/* Layout: phone app — tabs on top; puzzle/drill screen = coach bubble, full-width board, action bar; dossier = stacked cards */
:root{
  color-scheme:dark;
  --bg:#302E2B; --bg-2:#262421; --bar:#403E3B; --card:#3A3835; --ink:#FFFFFF; --ink-2:#DAD8D5; --muted:#9F9D9A; --line:#4A4744;
  --green:#81B64C; --green-d:#45753C; --red:#FA412D; --red-d:#A52A1C; --amber:#F7C045; --teal:#26C2A3; --blue:#749BBF;
  --sq-l:#EBECD0; --sq-d:#739552; --hl:#F5F682;
  --f-head:"Montserrat","Nunito Sans",system-ui,sans-serif;
  --f-ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:max(12px,env(safe-area-inset-left,0px)); --gut-r:max(12px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-2);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;
  padding-left:var(--gut);padding-right:var(--gut-r);padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:600px;margin:0 auto}
.bleed{margin-left:calc(-1*var(--gut));margin-right:calc(-1*var(--gut-r))}
@media (min-width:640px){.bleed{margin-left:0;margin-right:0}}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-2);padding-top:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px}
.hdr h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.hdr h1 .vs{font-size:12px;font-family:var(--f-ui);font-weight:800;background:var(--bar);color:var(--ink-2);border-radius:6px;padding:3px 8px}
.score{font-weight:800;font-size:13px;color:var(--muted);text-align:right;line-height:1.2}
.score b{color:#fff;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bar);border-radius:12px;padding:4px;margin:6px 0 10px}
.tab{padding:9px 4px;border-radius:9px;font-weight:800;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:#fff;color:#312E2B}
.tab .cnt{font-size:11px;background:var(--green);color:#fff;border-radius:999px;padding:1px 6px}
.tab[aria-selected="true"] .cnt{background:var(--green-d)}

/* set chooser */
.sets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.sets::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--bar);font-weight:800;font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--green);color:#fff}
.chip small{font-weight:800;opacity:.75}

/* progress dots */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px}
.dot{width:22px;height:22px;border-radius:6px;background:var(--bar);font-size:10.5px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.dot.ok{background:var(--green);color:#fff}
.dot.fail{background:var(--red);color:#fff}
.dot.cur{outline:2px solid #fff;outline-offset:1px;color:#fff}

/* coach bubble */
.coach{display:flex;align-items:flex-end;margin:4px 0 14px;min-height:96px}
.bot{width:70px;flex:none;margin-right:-2px;position:relative;z-index:1}
.bot svg{display:block;width:70px;height:80px}
.bubble{position:relative;flex:1;min-width:0;background:#fff;color:#312E2B;border-radius:14px;padding:12px 14px 13px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bubble::before{content:"";position:absolute;left:-8px;bottom:20px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bhead{display:flex;align-items:center;gap:8px;position:relative}
.ico{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:-.05em}
.ico svg{width:16px;height:16px}
.bt{flex:1;min-width:0;font-family:var(--f-head);font-weight:800;font-size:16px;line-height:1.2}
.tag{flex:none;background:#3C3936;color:#fff;font-weight:800;font-size:12.5px;border-radius:7px;padding:4px 9px;white-space:nowrap}
.btext{margin:7px 0 0;font-size:15.5px;font-weight:600;line-height:1.35;position:relative}
.btext b{font-weight:800}
.bubble.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mini{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em;margin-right:1px}

/* board */
.board{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none}
@media (min-width:640px){.board{border-radius:4px;overflow:hidden}}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq .tint{position:absolute;inset:0;background:var(--hl);opacity:.5}
.sq .sel{position:absolute;inset:0;background:#FFD54A;opacity:.55}
.sq .ok{position:absolute;inset:0;background:var(--green);opacity:.6}
.sq .bad{position:absolute;inset:0;background:var(--red);opacity:.55}
.sq .hint{position:absolute;inset:0;box-shadow:inset 0 0 0 .9cqw var(--teal)}
.sq .dotm{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(0,0,0,.17)}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 1cqw rgba(0,0,0,.17)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform}
.cp{display:block;background-size:cover;background-repeat:no-repeat;background-position:center}
.cp.mini{display:inline-block}

.co{position:absolute;font-size:2.6cqw;font-weight:800;line-height:1;pointer-events:none}
.co.r{top:3.5%;left:4%}.co.f{bottom:3%;right:4.5%}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.badge{position:absolute;top:-2cqw;right:-2cqw;width:6.2cqw;height:6.2cqw;border-radius:50%;color:#fff;font-weight:800;font-size:3.6cqw;display:grid;place-items:center;z-index:4;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.4);animation:pop .22s .16s both cubic-bezier(.3,1.6,.5,1)}
.badge svg{width:62%;height:62%}
.sq.et .badge{top:.3cqw}.sq.er .badge{right:.3cqw}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:3}
.turn{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.turn .who{display:flex;align-items:center;gap:7px}
.turn .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted)}
.turn .sw.w{background:#fff}.turn .sw.b{background:#1E1C1A}
.line{font-weight:800;font-size:14px;color:var(--ink-2);margin-top:8px;min-height:20px;display:flex;flex-wrap:wrap;gap:2px 6px}
.line .n{color:var(--muted);font-weight:700}
.line .now{background:var(--bar);border-radius:5px;padding:0 5px;color:#fff}

/* action bar */
.abar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg-2);padding:8px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut)}
.abar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 2.2fr;gap:6px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;color:#BAB8B5;font-weight:800;font-size:12.5px;padding:5px 0;border-radius:8px}
.act svg{width:28px;height:28px}
.act:disabled{opacity:.35}
.act:active{background:var(--bar)}
.main{height:54px;border-radius:12px;background:var(--green);color:#fff;font-family:var(--f-head);font-weight:800;font-size:19px;box-shadow:0 5px 0 var(--green-d);margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:8px}
.main svg{width:24px;height:24px}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.main.ghost{background:#4B4847;box-shadow:0 5px 0 #2E2C2A}

/* dossier */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg);border-radius:14px;padding:15px}
.card h2{font-family:var(--f-head);font-size:16px;font-weight:800;margin:0 0 12px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg-2);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-head);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.stat.good b{color:var(--green)}.stat.bad b{color:var(--red)}.stat.warn b{color:var(--amber)}
.lead{font-size:15px;color:var(--ink-2);margin:12px 0 0;font-weight:600}
.lead b{color:#fff}
.rep{display:flex;flex-direction:column;gap:8px}
.repi{background:var(--bg-2);border-radius:11px;padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.repi .mv{font-weight:800;font-size:14.5px}
.repi .mv small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px}
.pill{font-weight:800;font-size:12px;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.r{background:rgba(250,65,45,.18);color:#FF8A7A}.pill.g{background:rgba(129,182,76,.2);color:#A6D86F}.pill.y{background:rgba(247,192,69,.18);color:#F7C045}
.sw2{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.sw2.w{background:#E8E6E1}.sw2.b{background:#4A4643}
.sw2 > *{width:21px;height:21px}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bul li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.bul li b{color:#fff}
.bul .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.check{counter-reset:c}
.go{display:block;width:100%;margin-top:12px;background:var(--green);color:#fff;border-radius:11px;padding:12px;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--green-d)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.foot{font-size:12.5px;color:var(--muted);margin:14px 2px 0}

/* drills list */
.drills-old{display:flex;gap:8px;margin:0 calc(-1*var(--gut-r)) 12px 0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-right:var(--gut-r)}
.drills::-webkit-scrollbar{display:none}
.dr-old{flex:none;width:min(250px,72vw);scroll-snap-align:start;display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;background:var(--bg);border-radius:13px;padding:11px 12px;text-align:left}
.dr .st{grid-column:2}
.dr[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--green)}
.dr .t{font-weight:800;font-size:14.5px;min-width:0}
.dr .t small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .st{font-weight:800;font-size:12px;color:var(--muted)}
.dr .st.done{color:var(--green)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150%);z-index:50;background:#fff;color:#312E2B;font-weight:800;font-size:14px;border-radius:12px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dr .st{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stars{color:#6E6B67;font-size:14px;letter-spacing:1px}.stars.done{color:var(--amber)}
.pill.t{background:rgba(38,194,163,.18);color:#5FE0C6}
.jump{display:inline-block;margin-left:4px;background:var(--green);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;vertical-align:1px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.opt .switch{width:44px;height:26px}.opt .switch::after{width:20px;height:20px}.opt .switch:checked::after{transform:translateX(18px)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:#5A5754;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--green)}
#v-sheet .card{margin-bottom:12px}
.opening{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.opening .sw2{width:38px;height:38px;border-radius:10px}.opening .sw2 > *{width:32px;height:32px}
.opening b{font-family:var(--f-head);font-size:17px;display:block}.opening small{color:var(--muted);font-weight:700;font-size:13px}
.branches{margin-top:16px}
.branches .bh{display:flex;justify-content:space-between;align-items:baseline}
.branches .bh span{color:var(--muted);font-weight:800;font-size:13px}
.brl{display:flex;flex-direction:column;gap:6px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--bg-2);border-radius:11px;padding:10px 12px;text-align:left}
.br[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--green)}
.br b{font-size:14.5px}.br small{grid-column:1;color:var(--muted);font-weight:700;font-size:12.5px;font-family:var(--f-ui)}
.br .stars{grid-row:1/3;grid-column:2}
</style>
</head>

try{ SAVE=JSON.parse(localStorage.getItem("my-repertoire")||"{}")||{}; }catch(e){ SAVE={}; }
const persist=()=>{ try{ localStorage.setItem("my-repertoire",JSON.stringify(SAVE)); }catch(e){} };
const stars=id=>(SAVE[id]&&SAVE[id].s)||0;
let ARROWS=true; try{ ARROWS=localStorage.getItem("my-rep-arrows")!=="0"; }catch(e){}

/* ---------- sound ---------- */
let AC=null;
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){} } if(AC.state==="suspended") AC.resume(); return AC; }
let unlocked=false;
document.addEventListener("pointerdown",()=>{ if(unlocked) return; unlocked=true; try{ const ac=audio(), b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); const el=document.createElement("audio"); el.src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; el.play().catch(()=>{}); }catch(e){} },{passive:true});
function knock(ac,t,f,g,d){ const n=Math.floor(ac.sampleRate*d*1.6), buf=ac.createBuffer(1,n,ac.sampleRate), x=buf.getChannelData(0); for(let i=0;i<n;i++) x[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*d*.18)); const s=ac.createBufferSource(); s.buffer=buf; const bp=ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f; bp.Q.value=6; const gg=ac.createGain(); gg.gain.value=g; s.connect(bp).connect(gg).connect(ac.destination); s.start(t); const o=ac.createOscillator(), og=ac.createGain(); o.frequency.setValueAtTime(f*.42,t); o.frequency.exponentialRampToValueAtTime(f*.3,t+d); og.gain.setValueAtTime(g*.5,t); og.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(og).connect(ac.destination); o.start(t); o.stop(t+d+.02); }
function tone(ac,t,f,p,d,type){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(p,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); }
function snd(k){ try{ const ac=audio(), t=ac.currentTime+.01;
  if(k==="cap"){ knock(ac,t,1250,2.2,.07); knock(ac,t+.05,900,1.6,.08); }
  else if(k==="chk"){ knock(ac,t,1050,2,.08); tone(ac,t+.04,1320,.18,.3,"triangle"); }
  else if(k==="win"){ [659,784,988,1319].forEach((f,i)=>tone(ac,t+i*.08,f,.15,.3)); }
  else if(k==="bad"){ tone(ac,t,220,.16,.22,"square"); tone(ac,t+.09,180,.12,.25,"square"); }
  else knock(ac,t,880,2.4,.07); }catch(e){} }
const sndFor=m=>snd(m.san.includes("+")||m.san.includes("#")?"chk":m.captured?"cap":"move");

/* ---------- board ---------- */
const B={chess:null,flip:false,sel:null,last:null,marks:{},arrow:null,badge:null,locked:true,onMove:null};
const sqName=(f,r)=>"abcdefgh"[f]+r;
function sqXY(sq){ const f="abcdefgh".indexOf(sq[0]), r=+sq[1]; return B.flip?[7-f+.5,r-1+.5]:[f+.5,8-r+.5]; }
function render(anim){
  const bd=B.chess.board();
  const legal=B.sel?B.chess.moves({square:B.sel,verbose:true}):[];
  const tgt={}; legal.forEach(m=>tgt[m.to]=m);
  let html="";
  for(let dr=0;dr<8;dr++) for(let dc=0;dc<8;dc++){
    const rank=B.flip?dr+1:8-dr, file=B.flip?7-dc:dc, sq=sqName(file,rank), p=bd[8-rank][file];
    let s="";
    if(B.last&&(sq===B.last.from||sq===B.last.to)) s+=`<div class="tint"></div>`;
    if(B.marks[sq]) s+=`<div class="${B.marks[sq]}"></div>`;
    if(sq===B.sel) s+=`<div class="sel"></div>`;
    if(dc===0) s+=`<span class="co r">${rank}</span>`;
    if(dr===7) s+=`<span class="co f">${"abcdefgh"[file]}</span>`;
    if(p) s+=pieceSvg(p.color,p.type,"pc");
    if(tgt[sq]) s+=p?`<div class="ring"></div>`:`<div class="dotm"></div>`;
    if(B.badge&&B.badge.sq===sq) s+=`<span class="badge" style="background:${B.badge.color}">${B.badge.sym}</span>`;
    html+=`<div class="sq ${(file+rank)%2?"l":"d"}${dr===0?" et":""}${dc===7?" er":""}" data-sq="${sq}">${s}</div>`;
  }
  $("grid").innerHTML=html;
  $("arrows").innerHTML=B.arrow?arrowSvg(B.arrow[0],B.arrow[1],B.arrow[2]):"";
  if(anim) animate(anim);
  const t=B.chess.turn();
  $("turnSw").className="sw "+t; $("turnTxt").textContent=t==="w"?"Ход белых":"Ход чёрных";
}
function arrowSvg(from,to,color){
  const [x1,y1]=sqXY(from),[x2,y2]=sqXY(to), dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const head=.45,hw=.3,sw=.12,bx=x2-ux*head,by=y2-uy*head;
  const pts=[[x1+nx*sw,y1+ny*sw],[bx+nx*sw,by+ny*sw],[bx+nx*hw,by+ny*hw],[x2,y2],[bx-nx*hw,by-ny*hw],[bx-nx*sw,by-ny*sw],[x1-nx*sw,y1-ny*sw]];
  return `<polygon points="${pts.map(p=>p[0].toFixed(3)+","+p[1].toFixed(3)).join(" ")}" fill="${color||"#96BE46"}" opacity=".82"/>`;
}
function animate(m){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const list=[[m.from,m.to]], r=m.color==="w"?"1":"8";
  if(m.flags.includes("k")) list.push(["h"+r,"f"+r]);
  if(m.flags.includes("q")) list.push(["a"+r,"d"+r]);
  const size=$("board").clientWidth/8;
  for(const [a,b] of list){
    const el=$("grid").querySelector(`[data-sq="${b}"]`); const pc=el&&el.querySelector(".pc"); if(!pc) continue;
    const [fx,fy]=sqXY(a),[tx,ty]=sqXY(b);
    el.style.zIndex=6; pc.style.transition="none"; pc.style.transform=`translate(${(fx-tx)*size}px,${(fy-ty)*size}px)`;
    pc.getBoundingClientRect(); pc.style.transition="transform .2s cubic-bezier(.25,.8,.35,1)"; pc.style.transform="";
    setTimeout(()=>{el.style.zIndex="";},260);
  }
}
function playMove(mv,opts){
  const m=B.chess.move(mv); if(!m) return null;
  B.last=m; B.sel=null; B.marks={}; B.arrow=null; B.badge=(opts&&opts.badge)?{sq:m.to,...opts.badge}:null;
  render(m); sndFor(m); return m;
}
// input: tap a piece, tap a square; drag also works
let drag=null;
$("board").addEventListener("pointerdown",e=>{
  const el=e.target.closest(".sq"); if(!el||B.locked) return;
  const sq=el.dataset.sq, p=B.chess.get(sq);
  if(B.sel&&B.sel!==sq){
    const mv=B.chess.moves({square:B.sel,verbose:true}).find(m=>m.to===sq);
    if(mv){ tryUser(B.sel,sq); return; }
  }
  if(p&&p.color===B.chess.turn()){ B.sel=sq; render(); drag={from:sq,x:e.clientX,y:e.clientY,moved:false}; $("board").setPointerCapture(e.pointerId); }
  else { B.sel=null; render(); }
});
$("board").addEventListener("pointermove",e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<8) return;
  drag.moved=true;
  const pc=$("grid").querySelector(`[data-sq="${drag.from}"] .pc`); if(pc){ pc.style.transition="none"; pc.style.transform=`translate(${dx}px,${dy}px) scale(1.12)`; pc.parentElement.style.zIndex=8; }
});
$("board").addEventListener("pointerup",e=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.moved) return;
  const r=$("board").getBoundingClientRect(), s=r.width/8;
  const c=Math.floor((e.clientX-r.left)/s), rr=Math.floor((e.clientY-r.top)/s);
  if(c<0||c>7||rr<0||rr>7){ render(); return; }
  const file=B.flip?7-c:c, rank=B.flip?rr+1:8-rr, to=sqName(file,rank);
  const mv=B.chess.moves({square:d.from,verbose:true}).find(m=>m.to===to);
  if(mv) tryUser(d.from,to,true); else render();
});
function tryUser(from,to){
  const mv=B.chess.moves({square:from,verbose:true}).find(m=>m.to===to);
  const uci=from+to+(mv&&mv.promotion?"q":"");
  if(B.onMove) B.onMove(uci,from,to);
}

/* ---------- toast ---------- */
let tt; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2400); }


/* ---------- repertoire drills ---------- */
const MODE={tab:"b",cur:null};
const linesOf=side=>REP.filter(l=>l.side===side);
const STARS=n=>"★★★".slice(0,n)+"☆☆☆".slice(0,3-n);
function totals(){
  const all=REP.length*3, got=REP.reduce((a,l)=>a+stars(l.id),0);
  $("solvedN").textContent=REP.filter(l=>stars(l.id)>=3).length; $("solvedOf").textContent="из "+REP.length+" выучено";
  $("c-b").textContent=linesOf("b").filter(l=>stars(l.id)>=3).length+"/"+linesOf("b").length;
  $("c-w").textContent=linesOf("w").filter(l=>stars(l.id)>=3).length+"/"+linesOf("w").length;
}
function bubble(c,ico,title,tag,text){ $("bubble").innerHTML=`<div class="bhead"><span class="ico" style="background:${c}">${ico}</span><span class="bt">${title}</span>${tag?`<span class="tag">${esc(tag)}</span>`:""}</div><p class="btext">${text}</p>`; }
const OPEN={b:{name:"1...e5 — открытая игра",sub:"Ты чёрными. На 1.e4 всегда 1...e5 и 2...Nc6"},w:{name:"Лондонская система",sub:"Ты белыми. 1.d4, 2.Bf4, e3, Nf3, c3, Nbd2"}};
const branchMove=l=>{ const k=l.san.findIndex((s,i)=>(i%2===0?"w":"b")!==l.side&&REP.filter(x=>x.side===l.side&&x.san.slice(0,i+1).join(" ")===l.san.slice(0,i+1).join(" ")).length===1); return k<0?"":((k%2===0?(k/2+1)+".":(Math.floor(k/2)+1)+"...")+l.san[k]); };
function renderList(){
  const L=linesOf(MODE.tab), side=MODE.tab;
  $("openHead").innerHTML=`<span class="sw2 ${side}">${pieceSvg(side,"k","")}</span><span><b>${OPEN[side].name}</b><small>${OPEN[side].sub}</small></span>`;
  $("brCnt").textContent=`выучено ${L.filter(l=>stars(l.id)>=3).length} из ${L.length}`;
  const known=MODE.cur&&MODE.cur.revealed;
  $("drills").innerHTML=L.map(l=>`<button class="br" data-d="${l.id}" aria-current="${!!(known&&MODE.cur.l.id===l.id)}"><b>${esc(l.title)}</b><span class="stars${stars(l.id)>=3?" done":""}">${STARS(stars(l.id))}</span><small>${esc(branchMove(l))} · ${esc(l.sub)}</small></button>`).join("");
}
$("drills").addEventListener("click",e=>{ const b=e.target.closest("[data-d]"); if(!b) return; startLine(REP.find(l=>l.id===b.dataset.d),true); window.scrollTo({top:0,behavior:"smooth"}); });
function pickNext(){
  const L=linesOf(MODE.tab).slice();
  const curId=MODE.cur&&MODE.cur.l.id;
  // random branch, weak ones much more often; never the same twice in a row
  const pool=L.filter(l=>l.id!==curId); const src=pool.length?pool:L;
  const wts=src.map(l=>[8,4,2,1][stars(l.id)]); let r=Math.random()*wts.reduce((a,b)=>a+b,0);
  for(let i=0;i<src.length;i++){ r-=wts[i]; if(r<=0) return src[i]; } return src[0];
}
function startLine(l,explicit){
  MODE.cur={l,i:0,mistakes:0,hinted:false,done:false,revealed:!!explicit};
  B.chess=new Chess(); B.flip=l.side==="b"; B.sel=null; B.marks={}; B.arrow=null; B.badge=null; B.last=null; B.locked=true;
  B.onMove=userMove; $("lineBox").innerHTML="";
  const learn=stars(l.id)===0&&ARROWS;
  if(explicit) bubble("var(--green)",BOOK,esc(l.title),l.side==="w"?"ты белыми":"ты чёрными",`${esc(l.sub)}. ${learn?"Первый раз: зелёная стрелка покажет нужный ход, просто повторяй.":"Сыграй вариант по памяти. Три чистых прохода, и он выучен."}`);
  else bubble("var(--green)",BOOK,"Новая партия",l.side==="w"?"ты белыми":"ты чёрными",`Он сыграет один из своих вариантов, какой — узнаешь по ходу. Отвечай по системе.${learn?" Новый вариант — подскажу стрелкой.":""}`);
  $("ctx").innerHTML=`<span class="stars${stars(l.id)>=3?" done":""}">${STARS(stars(l.id))}</span>`;
  setMain("show"); renderList(); render();
  setTimeout(auto,650);
}
function lineBox(){
  const l=MODE.cur.l, i=MODE.cur.i;
  $("lineBox").innerHTML=l.san.slice(0,i).map((s,k)=>(k%2===0?`<span class="n">${k/2+1}.</span>`:"")+`<span${k===i-1?' class="now"':""}>${esc(s)}</span>`).join("");
}
function expected(){ const c=new Chess(B.chess.fen()); return c.move(MODE.cur.l.san[MODE.cur.i]); }
function auto(){
  const C=MODE.cur; if(!C||C.done) return; const l=C.l;
  if(C.i>=l.san.length){ finish(); return; }
  if(B.chess.turn()!==l.side){
    B.locked=true;
    const m=playMove(l.san[C.i]); C.i++; lineBox();
    let n=l.notes[C.i-1];
    if(!C.revealed&&REP.filter(x=>x.side===l.side&&x.san.slice(0,C.i).join(" ")===l.san.slice(0,C.i).join(" ")).length===1){
      C.revealed=true; renderList(); bubble("var(--blue)","!",`Он: ${sanHtml(m.san,m.color)} · ${esc(l.title)}`,"",(n?n+" ":"")+`Это ветка «${esc(l.title)}».`);
    } else bubble("var(--blue)","!",`Он: ${sanHtml(m.san,m.color)}`,"",n||"Твой ход.");
    setTimeout(auto,n?900:550);
  } else {
    B.locked=false;
    if(stars(l.id)===0&&ARROWS){ const e=expected(); B.arrow=[e.from,e.to,"#81B64C"]; render(); }
  }
}
function userMove(uci,from,to){
  const C=MODE.cur; if(!C||C.done) return;
  const e=expected();
  if(e&&e.from===from&&e.to===to){
    B.locked=true;
    const m=playMove({from,to,promotion:"q"},{badge:{color:"var(--green)",sym:CHECK}});
    C.i++; lineBox();
    const n=C.l.notes[C.i-1];
    bubble("var(--green)",CHECK,`${sanHtml(m.san,m.color)} — верно`,`${C.i}/${C.l.san.length}`,n||"Так и играем.");
    setTimeout(auto,n?1300:600);
  } else {
    C.mistakes++;
    const bad=new Chess(B.chess.fen()).move({from,to,promotion:"q"});
    B.marks={[from]:"bad",[to]:"bad"}; B.sel=null; render(); snd("bad");
    $("bubble").classList.remove("shake"); void $("bubble").offsetWidth; $("bubble").classList.add("shake");
    const h=C.l.hints[C.i];
    bubble("var(--red)",XX,`${bad?sanHtml(bad.san,bad.color):"Этот ход"} — не по плану`,"ошибка",h?esc(h):(C.mistakes>=2?"Нажми «Подсказка» или «Показать ход».":"В этом варианте играем по-другому. Вспомни ход."));
    setTimeout(()=>{ if(MODE.cur===C&&!C.done){ B.marks={}; render(); } },700);
  }
}
function hint(){
  const C=MODE.cur; if(!C||C.done||B.chess.turn()!==C.l.side) return;
  C.hinted=true; const e=expected(); B.marks={[e.from]:"hint"}; B.arrow=[e.from,e.to,"#26C2A3"]; render();
  bubble("var(--teal)","?","Подсказка","",C.l.hints[C.i]?esc(C.l.hints[C.i]):"Сделай ход по стрелке.");
}
function reveal(){
  const C=MODE.cur; if(!C||C.done||B.chess.turn()!==C.l.side) return;
  C.hinted=true; const e=expected(); userMove(e.from+e.to,e.from,e.to);
}
function finish(){
  const C=MODE.cur; C.done=true; B.locked=true; const id=C.l.id;
  const clean=C.mistakes===0&&!C.hinted, learnRun=stars(id)===0&&ARROWS;
  const s0=stars(id); let s=s0;
  if(clean) s=Math.min(3,s0+1); else if(C.mistakes>=2) s=Math.max(0,s0-1);
  SAVE[id]={s,t:Date.now()}; persist(); C.revealed=true; totals(); renderList();
  $("ctx").innerHTML=`<span class="stars${s>=3?" done":""}">${STARS(s)}</span>`;
  snd(clean?"win":"move");
  let msg;
  if(s>=3&&s0<3) msg="Вариант выучен! Иногда повторяй его, чтобы не забыть.";
  else if(clean&&learnRun) msg="Отлично. Дальше стрелок не будет: сыграй его по памяти ещё два раза.";
  else if(clean) msg=`Чистый проход. ${s<3?`Ещё ${3-s} — и вариант выучен.`:"Он по-прежнему выучен."}`;
  else if(C.mistakes===0) msg="Ты подсматривал ходы. Пройди вариант ещё раз сам.";
  else msg=`Ошибок: ${C.mistakes}${C.hinted?", были подсказки":""}. Пройди его ещё раз.`;
  bubble(clean?"var(--green)":"var(--amber)",clean?STAR:"!",clean?"Вариант пройден!":(C.mistakes?"Вариант пройден с ошибками":"Вариант пройден с подсказками"),C.l.ev,msg);
  setMain(clean?"next":"again");
}
function setMain(k){
  const b=$("b-main"); b.dataset.k=k;
  if(k==="show"){ b.className="main ghost"; b.textContent="Показать ход"; }
  else if(k==="again"){ b.className="main"; b.textContent="Ещё раз"; }
  else { b.className="main"; b.innerHTML=`Следующий <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`; }
}

      <li><span class="k" style="background:var(--green)">1</span><span>Одна расстановка на всё: <b>d4, Bf4, e3, Nf3, c3, Nbd2, Bd3 или Be2, рокировка</b>.</span></li>
      <li><span class="k" style="background:var(--bar)">→</span><span>Слон выходит на f4 <b>раньше</b> пешки e3. На ...Bd6 отводи слона на g3 или меняйся.</span></li>
      <li><span class="k" style="background:var(--bar)">→</span><span>Если он играет ...Nc6 и бьёт ...e5 — <b>Bxe5!</b>, лишняя пешка. ${ln("w-l3","Тренировать")}</span></li>
      <li><span class="k" style="background:var(--bar)">→</span><span>На <b>1...c5</b> не бери: <b>2.d5</b>, потом Nc3 и e4. ${ln("w-l5","Тренировать")}</span></li>
      <li><span class="k" style="background:var(--bar)">→</span><span>Ход <b>h3</b> — место для слона и «форточка» для короля.</span></li>
    </ul>
  </div>
  <div class="card"><h2>Правила для любого дебюта</h2>
    <ul class="bul">
      <li><span class="k" style="background:var(--blue)">1</span><span>Ферзь не ходит до 6–7-го хода.</span></li>
      <li><span class="k" style="background:var(--blue)">2</span><span>Одной фигурой дважды не ходим, пока остальные стоят дома.</span></li>
      <li><span class="k" style="background:var(--blue)">3</span><span>Рокировка к 8–10-му ходу. Пешки перед королём не двигаем.</span></li>
      <li><span class="k" style="background:var(--blue)">4</span><span>После каждого его хода: что он атакует? Особенно f2 и f7.</span></li>
    </ul>
  </div>
  <p class="foot">Все ходы проверены движком Stockfish. Звёзды показывают, сколько раз ты прошёл вариант без ошибок, и хранятся в этом браузере. Фигуры: Colin M.L. Burnett, CC BY-SA 3.0.</p>`;
}
$("sheet").addEventListener("click",e=>{ const b=e.target.closest("[data-j]"); if(!b) return; const l=REP.find(x=>x.id===b.dataset.j); switchTab(l.side); startLine(l,true); });

/* ---------- tabs ---------- */
function switchTab(t){
  MODE.tab=t;
  ["b","w","s"].forEach(x=>$("t-"+x).setAttribute("aria-selected",x===t));
  $("v-play").hidden=t==="s"; $("v-sheet").hidden=t!=="s"; $("abar").hidden=t==="s";
  if(t==="s") renderSheet(); else if(!MODE.cur||MODE.cur.l.side!==t) startLine(pickNext());
  window.scrollTo({top:0});
}
$("t-b").onclick=()=>switchTab("b"); $("t-w").onclick=()=>switchTab("w"); $("t-s").onclick=()=>switchTab("s");
$("b-hint").onclick=hint;
$("b-retry").onclick=()=>MODE.cur&&startLine(MODE.cur.l);
$("b-main").onclick=()=>{ const k=$("b-main").dataset.k; if(k==="show") reveal(); else if(k==="again") startLine(MODE.cur.l); else startLine(pickNext()); };
$("arrowsT").checked=ARROWS;
$("arrowsT").onchange=e=>{ ARROWS=e.target.checked; try{ localStorage.setItem("my-rep-arrows",ARROWS?"1":"0"); }catch(_){} if(MODE.cur&&!MODE.cur.done) startLine(MODE.cur.l); };
let lastT=0; document.addEventListener("touchend",e=>{ if(e.target.closest("input,select,textarea,label")) return; const n=Date.now(); if(n-lastT<350){ e.preventDefault(); const t=e.target.closest("button,a"); if(t) t.click(); } lastT=n; },{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());

/* ---------- boot ---------- */
if(typeof Chess==="undefined"){ $("bubble").textContent="Не загрузилась шахматная библиотека. Проверь интернет и обнови страницу."; return; }
totals(); switchTab("b");

})();
</script>
