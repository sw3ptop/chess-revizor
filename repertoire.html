<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#262421">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Мои дебюты</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:opsz,wght@6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: phone app — tabs (black / white / cheat sheet); line cards scroll sideways above the coach and board */
/* Layout: phone app — tabs on top; puzzle/drill screen = coach bubble, full-width board, action bar; dossier = stacked cards */
:root{
  color-scheme:dark;
  --bg:#302E2B; --bg-2:#262421; --bar:#403E3B; --card:#3A3835; --ink:#FFFFFF; --ink-2:#DAD8D5; --muted:#9F9D9A; --line:#4A4744;
  --green:#81B64C; --green-d:#45753C; --red:#FA412D; --red-d:#A52A1C; --amber:#F7C045; --teal:#26C2A3; --blue:#749BBF;
  --sq-l:#EBECD0; --sq-d:#739552; --hl:#F5F682;
  --f-head:"Montserrat","Nunito Sans",system-ui,sans-serif;
  --f-ui:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gut:max(12px,env(safe-area-inset-left,0px)); --gut-r:max(12px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-2);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.4;
  padding-left:var(--gut);padding-right:var(--gut-r);padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-2)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:600px;margin:0 auto}
.bleed{margin-left:calc(-1*var(--gut));margin-right:calc(-1*var(--gut-r))}
@media (min-width:640px){.bleed{margin-left:0;margin-right:0}}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg-2);padding-top:8px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;height:46px}
.hdr h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.hdr h1 .vs{font-size:12px;font-family:var(--f-ui);font-weight:800;background:var(--bar);color:var(--ink-2);border-radius:6px;padding:3px 8px}
.score{font-weight:800;font-size:13px;color:var(--muted);text-align:right;line-height:1.2}
.score b{color:#fff;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bar);border-radius:12px;padding:4px;margin:6px 0 10px}
.tab{padding:9px 2px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:#fff;color:#312E2B}
.tab .cnt{font-size:11px;background:var(--green);color:#fff;border-radius:999px;padding:1px 6px}
.tab[aria-selected="true"] .cnt{background:var(--green-d)}

/* set chooser */
.sets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.sets::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--bar);font-weight:800;font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--green);color:#fff}
.chip small{font-weight:800;opacity:.75}

/* progress dots */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px}
.dot{width:22px;height:22px;border-radius:6px;background:var(--bar);font-size:10.5px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.dot.ok{background:var(--green);color:#fff}
.dot.fail{background:var(--red);color:#fff}
.dot.cur{outline:2px solid #fff;outline-offset:1px;color:#fff}

/* coach bubble */
.coach{display:flex;align-items:flex-end;margin:4px 0 14px;min-height:96px}
.bot{width:70px;flex:none;margin-right:-2px;position:relative;z-index:1}
.bot svg{display:block;width:70px;height:80px}
.bubble{position:relative;flex:1;min-width:0;background:#fff;color:#312E2B;border-radius:14px;padding:12px 14px 13px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.bubble::before{content:"";position:absolute;left:-8px;bottom:20px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bhead{display:flex;align-items:center;gap:8px;position:relative}
.ico{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;letter-spacing:-.05em}
.ico svg{width:16px;height:16px}
.bt{flex:1;min-width:0;font-family:var(--f-head);font-weight:800;font-size:16px;line-height:1.2}
.tag{flex:none;background:#3C3936;color:#fff;font-weight:800;font-size:12.5px;border-radius:7px;padding:4px 9px;white-space:nowrap}
.btext{margin:7px 0 0;font-size:15.5px;font-weight:600;line-height:1.35;position:relative}
.btext b{font-weight:800}
.bubble.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mini{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.16em;margin-right:1px}

/* board */
.board{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none}
@media (min-width:640px){.board{border-radius:4px;overflow:hidden}}
.grid{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.sq{position:relative;cursor:pointer}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq .tint{position:absolute;inset:0;background:var(--hl);opacity:.5}
.sq .sel{position:absolute;inset:0;background:#FFD54A;opacity:.55}
.sq .ok{position:absolute;inset:0;background:var(--green);opacity:.6}
.sq .bad{position:absolute;inset:0;background:var(--red);opacity:.55}
.sq .hint{position:absolute;inset:0;box-shadow:inset 0 0 0 .9cqw var(--teal)}
.sq .dotm{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(0,0,0,.17)}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 1cqw rgba(0,0,0,.17)}
.pc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform}
.cp{display:block;background-size:cover;background-repeat:no-repeat;background-position:center}
.cp.mini{display:inline-block}

.co{position:absolute;font-size:2.6cqw;font-weight:800;line-height:1;pointer-events:none}
.co.r{top:3.5%;left:4%}.co.f{bottom:3%;right:4.5%}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}
.badge{position:absolute;top:-2cqw;right:-2cqw;width:6.2cqw;height:6.2cqw;border-radius:50%;color:#fff;font-weight:800;font-size:3.6cqw;display:grid;place-items:center;z-index:4;box-shadow:0 .4cqw 1cqw rgba(0,0,0,.4);animation:pop .22s .16s both cubic-bezier(.3,1.6,.5,1)}
.badge svg{width:62%;height:62%}
.sq.et .badge{top:.3cqw}.sq.er .badge{right:.3cqw}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:3}
.turn{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.turn .who{display:flex;align-items:center;gap:7px}
.turn .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--muted)}
.turn .sw.w{background:#fff}.turn .sw.b{background:#1E1C1A}
.line{font-weight:800;font-size:14px;color:var(--ink-2);margin-top:8px;min-height:20px;display:flex;flex-wrap:wrap;gap:2px 6px}
.line .n{color:var(--muted);font-weight:700}
.line .now{background:var(--bar);border-radius:5px;padding:0 5px;color:#fff}

/* action bar */
.abar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg-2);padding:8px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut)}
.abar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 2.2fr;gap:6px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;color:#BAB8B5;font-weight:800;font-size:12.5px;padding:5px 0;border-radius:8px}
.act svg{width:28px;height:28px}
.act:disabled{opacity:.35}
.act:active{background:var(--bar)}
.main{height:54px;border-radius:12px;background:var(--green);color:#fff;font-family:var(--f-head);font-weight:800;font-size:19px;box-shadow:0 5px 0 var(--green-d);margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:8px}
.main svg{width:24px;height:24px}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
.main.ghost{background:#4B4847;box-shadow:0 5px 0 #2E2C2A}

/* dossier */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg);border-radius:14px;padding:15px}
.card h2{font-family:var(--f-head);font-size:16px;font-weight:800;margin:0 0 12px;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg-2);border-radius:11px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-head);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.stat.good b{color:var(--green)}.stat.bad b{color:var(--red)}.stat.warn b{color:var(--amber)}
.lead{font-size:15px;color:var(--ink-2);margin:12px 0 0;font-weight:600}
.lead b{color:#fff}
.rep{display:flex;flex-direction:column;gap:8px}
.repi{background:var(--bg-2);border-radius:11px;padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.repi .mv{font-weight:800;font-size:14.5px}
.repi .mv small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px}
.pill{font-weight:800;font-size:12px;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.r{background:rgba(250,65,45,.18);color:#FF8A7A}.pill.g{background:rgba(129,182,76,.2);color:#A6D86F}.pill.y{background:rgba(247,192,69,.18);color:#F7C045}
.sw2{width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.sw2.w{background:#E8E6E1}.sw2.b{background:#4A4643}
.sw2 > *{width:21px;height:21px}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.bul li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.bul li b{color:#fff}
.bul .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.check{counter-reset:c}
.go{display:block;width:100%;margin-top:12px;background:var(--green);color:#fff;border-radius:11px;padding:12px;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--green-d)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.foot{font-size:12.5px;color:var(--muted);margin:14px 2px 0}

/* drills list */
.drills-old{display:flex;gap:8px;margin:0 calc(-1*var(--gut-r)) 12px 0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-right:var(--gut-r)}
.drills::-webkit-scrollbar{display:none}
.dr-old{flex:none;width:min(250px,72vw);scroll-snap-align:start;display:grid;grid-template-columns:30px 1fr;grid-template-rows:auto auto;gap:4px 10px;align-items:center;background:var(--bg);border-radius:13px;padding:11px 12px;text-align:left}
.dr .st{grid-column:2}
.dr[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--green)}
.dr .t{font-weight:800;font-size:14.5px;min-width:0}
.dr .t small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .st{font-weight:800;font-size:12px;color:var(--muted)}
.dr .st.done{color:var(--green)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150%);z-index:50;background:#fff;color:#312E2B;font-weight:800;font-size:14px;border-radius:12px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .3s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dr .st{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stars{color:#6E6B67;font-size:14px;letter-spacing:1px}.stars.done{color:var(--amber)}
.pill.t{background:rgba(38,194,163,.18);color:#5FE0C6}
.jump{display:inline-block;margin-left:4px;background:var(--green);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;vertical-align:1px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;font-weight:800;font-size:13.5px;color:var(--muted)}
.opt .switch{width:44px;height:26px}.opt .switch::after{width:20px;height:20px}.opt .switch:checked::after{transform:translateX(18px)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:#5A5754;position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--green)}
#v-sheet .card{margin-bottom:12px}
.opening{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.opening .sw2{width:38px;height:38px;border-radius:10px}.opening .sw2 > *{width:32px;height:32px}
.opening b{font-family:var(--f-head);font-size:17px;display:block}.opening small{color:var(--muted);font-weight:700;font-size:13px}
.branches{margin-top:16px}
.branches .bh{display:flex;justify-content:space-between;align-items:baseline}
.branches .bh span{color:var(--muted);font-weight:800;font-size:13px}
.brl{display:flex;flex-direction:column;gap:6px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--bg-2);border-radius:11px;padding:10px 12px;text-align:left}
.br[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--green)}
.br b{font-size:14.5px}.br small{grid-column:1;color:var(--muted);font-weight:700;font-size:12.5px;font-family:var(--f-ui)}
.br .stars{grid-row:1/3;grid-column:2}
.grp{font-weight:800;font-size:13px;color:var(--muted);margin:8px 2px 2px;text-transform:uppercase;letter-spacing:.05em}
.grp:first-child{margin-top:0}
.relink{color:var(--green);font-weight:800;font-size:13px;text-decoration:underline}
</style>
</head>

  </div>
  <div class="card"><h2>Перед каждым ходом</h2>
    <ul class="bul">
      <li><span class="k" style="background:var(--blue)">1</span><span>Что атакует его последний ход? Есть ли шах, взятие, угроза?</span></li>
      <li><span class="k" style="background:var(--blue)">2</span><span>После моего хода — не останется ли фигура без защиты?</span></li>
      <li><span class="k" style="background:var(--blue)">3</span><span>Если меняюсь — посчитал, кто сколько забирает?</span></li>
      <li><span class="k" style="background:var(--blue)">4</span><span>В дебюте: ферзь не раньше 6–7-го хода, рокировка к 10-му.</span></li>
    </ul>
  </div>
  <p class="foot">Все ходы проверены движком Stockfish. Звёзды и решённые задачи хранятся в этом браузере. Фигуры: Colin M.L. Burnett, CC BY-SA 3.0.</p>`;
}
$("sheet").addEventListener("click",e=>{ const b=e.target.closest("[data-j]"); if(!b) return; const l=REP.find(x=>x.id===b.dataset.j); switchTab(l.tab||l.side); startLine(l,true); });

/* ---------- tabs ---------- */
function switchTab(t){
  MODE.tab=t;
  ["w","b","m","s"].forEach(x=>$("t-"+x).setAttribute("aria-selected",x===t));
  $("v-play").hidden=t==="s"; $("v-sheet").hidden=t!=="s"; $("abar").hidden=t==="s";
  if(t==="s") renderSheet(); else if(!MODE.cur||(MODE.cur.l.tab||MODE.cur.l.side)!==t) startLine(pickNext());
  window.scrollTo({top:0});
}
$("t-b").onclick=()=>switchTab("b"); $("t-w").onclick=()=>switchTab("w"); $("t-s").onclick=()=>switchTab("s"); $("t-m").onclick=()=>switchTab("m");
$("b-hint").onclick=hint;
$("b-retry").onclick=()=>{ if(MODE.cur) startLine(MODE.cur.l,true); };
$("b-main").onclick=()=>{ const k=$("b-main").dataset.k; if(k==="none") return; if(k==="show") reveal(); else if(k==="again") startLine(MODE.cur.l); else startLine(pickNext()); };
$("arrowsT").checked=ARROWS;
$("arrowsT").onchange=e=>{ ARROWS=e.target.checked; try{ localStorage.setItem("my-rep-arrows",ARROWS?"1":"0"); }catch(_){} if(MODE.cur&&!MODE.cur.done) startLine(MODE.cur.l); };
let lastT=0; document.addEventListener("touchend",e=>{ if(e.target.closest("input,select,textarea,label")) return; const n=Date.now(); if(n-lastT<350){ e.preventDefault(); const t=e.target.closest("button,a"); if(t) t.click(); } lastT=n; },{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());

/* ---------- boot ---------- */
if(typeof Chess==="undefined"){ $("bubble").textContent="Не загрузилась шахматная библиотека. Проверь интернет и обнови страницу."; return; }
totals(); switchTab("w");

})();
</script>
